<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="MiauNote — suas anotações, em um cantinho aconchegante.">
    <title>Editar anotação · MiauNote</title>
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>
    <header class="topbar app-topbar">
      <a class="brand" href="inicio.html" aria-label="MiauNote, início">
          <svg class="emblem" viewBox="0 0 64 64" fill="none" aria-hidden="true" focusable="false">
            <path d="M32 3 56 16v30L32 61 8 46V16Z" stroke="currentColor"/>
            <path d="M16 29c6-2 11-1 16 3 5-4 10-5 16-3v18c-6-2-11-1-16 2-5-3-10-4-16-2Z" stroke="currentColor" stroke-width="1.8"/>
            <path d="M32 32v17M20 34l8 2m-8 4 8 2m8-6 8-2m-8 8 8-2M32 12l2.5 5.5 6 .7-4.5 4 1.2 5.8-5.2-3-5.2 3 1.2-5.8-4.5-4 6-.7Z" stroke="currentColor" stroke-linejoin="round"/>
          </svg>
          <span class="brand-text">MiauNote<small>Seu cantinho de ideias</small></span>
        </a>
      <nav aria-label="Navegação principal">
        <a href="inicio.html">Minhas notas</a>
        <a href="perfil.html">Meu perfil</a>
      </nav>
      <div class="header-session">
        <span id="header-user"></span>
        <button id="logout" class="secondary" type="button">Sair</button>
      </div>
    </header>
    <main class="workspace app-workspace">
      <div id="loading" class="loading" role="status" aria-live="polite">Validando sua sessão…</div>
      <div id="message" class="notice" role="status" aria-live="polite" aria-atomic="true" hidden></div>
      <button id="retry" class="secondary" type="button" hidden>Tentar novamente</button>
      <section id="content" hidden>
        <span class="eyebrow">Um lugar só seu</span>
        <h1 id="page-title">Nova anotação</h1>
        <form id="task-form" class="account-card editor">
          <div id="form-message" class="notice" role="status" aria-live="polite" aria-atomic="true" hidden></div>
          <div class="form-field">
            <label for="title">Título da anotação</label>
            <input id="title" name="title" required maxlength="150" aria-describedby="title-count">
            <small id="title-count" class="hint">0/150 caracteres</small>
          </div>
          <div class="form-field">
            <label for="description">Sua anotação <span class="optional">(opcional)</span></label>
            <textarea id="description" name="description" rows="7" maxlength="500" aria-describedby="description-count"></textarea>
            <small id="description-count" class="hint">0/500 caracteres</small>
          </div>
          <div class="actions">
            <button id="save-task" class="primary fit-button" type="submit">Salvar anotação</button>
            <a class="paper-button" href="inicio.html">Voltar</a>
          </div>
        </form>
      </section>
      <footer class="home-footer">
        <a href="inicio.html">Voltar para minhas notas</a>
        <p>Um espaço aconchegante para suas ideias. 🐾</p>
      </footer>
    </main>
    
    <script type="module" src="js/task-form.js"></script>
  </body>
</html>
