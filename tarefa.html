<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="TaskLab — Seu grimório de tarefas.">
    <title>Salvar tarefa · TaskLab</title>
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>
    <header class="topbar app-topbar">
      <a class="brand" href="inicio.html" aria-label="TaskLab, início">
          <svg class="emblem" viewBox="0 0 64 64" fill="none" aria-hidden="true" focusable="false"><path d="M32 3 57 15v25c0 10-15 19-25 22C22 59 7 50 7 40V15Z" stroke="currentColor" stroke-width="2"/><path d="m35 12-15 23h12l-3 17 16-25H33Z" fill="currentColor"/><path d="M13 21h8m-8 7h4m34-7h-8m8 7h-4" stroke="currentColor" stroke-width="2"/></svg>
          <span class="brand-text">TaskLab<small>Seu grimório de tarefas</small></span>
        </a>
      <nav aria-label="Navegação principal">
        <a href="inicio.html">Minhas tarefas</a>
        <a href="perfil.html">Meu perfil</a>
      </nav>
      <div class="header-session">
        <span id="header-user"></span>
        <button id="logout" class="secondary" type="button">Sair</button>
      </div>
    </header>
    <main class="workspace app-workspace">
      <div id="loading" class="loading" role="status" aria-live="polite">Validando sua sessão…</div>
      <div id="message" class="notice" role="status" aria-live="polite" aria-atomic="true" hidden></div>
      <button id="retry" class="secondary" type="button" hidden>Tentar novamente</button>
      <section id="content" hidden>
        <span class="eyebrow">Escreva seu próximo capítulo</span>
        <h1 id="page-title">Uma nova missão</h1>
        <form id="task-form" class="account-card editor">
          <div id="form-message" class="notice" role="status" aria-live="polite" aria-atomic="true" hidden></div>
          <div class="form-field">
            <label for="title">Título</label>
            <input id="title" name="title" required maxlength="150" aria-describedby="title-count">
            <small id="title-count" class="hint">0/150 caracteres</small>
          </div>
          <div class="form-field">
            <label for="description">Descrição <span class="optional">(opcional)</span></label>
            <textarea id="description" name="description" rows="7" maxlength="500" aria-describedby="description-count"></textarea>
            <small id="description-count" class="hint">0/500 caracteres</small>
          </div>
          <div class="actions">
            <button id="save-task" class="primary fit-button" type="submit">Salvar</button>
            <a class="paper-button" href="inicio.html">Cancelar</a>
          </div>
        </form>
      </section>
      <footer class="home-footer">
        <a href="inicio.html">Voltar para Minhas tarefas</a>
        <p>TaskLab Motor Club ? No seu ritmo. Na sua dire??o.</p>
      </footer>
    </main>
    
    <script type="module" src="js/task-form.js"></script>
  </body>
</html>
